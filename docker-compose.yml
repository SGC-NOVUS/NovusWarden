# NovusWarden Production Compose
# Ultra-lightweight, high-performance Bitwarden-compatible vault
# Maintained by SGC-NOVUS (System Generations Core Novus) - AGPL-3.0

services:
  novuswarden:
    image: ghcr.io/sgc-novus/novuswarden:latest
    container_name: novuswarden
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # General configuration
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - SHOW_PASSWORD_HINT=false
      
      # Database: defaults to embedded SQLite in /data/db.sqlite3 (<30 MB RAM)
      # For external PostgreSQL, uncomment and configure:
      # - DATABASE_URL=postgresql://novus_user:secret_password@postgres:5432/novuswarden?sslmode=prefer
      
      # Object Storage: optional Cloudflare R2 / AWS S3 / MinIO backend
      # - DATA_FOLDER=s3://my-vault-bucket/novuswarden/
      # - AWS_ENDPOINT=https://<account_id>.r2.cloudflarestorage.com
      # - AWS_ACCESS_KEY_ID=your_access_key
      # - AWS_SECRET_ACCESS_KEY=your_secret_key
      # - AWS_REGION=auto
      
      # Email notifications (SMTP or Resend)
      # - SMTP_HOST=smtp.mailgun.org
      # - SMTP_FROM=support@sgc-novus.fun
      # - SMTP_PORT=587
      # - SMTP_SECURITY=starttls
      # - SMTP_USERNAME=your_username
      # - SMTP_PASSWORD=your_password
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

