version: "3.8"

services:
  novuswarden:
    image: ghcr.io/sgc-novus/novuswarden:latest
    container_name: novuswarden
    restart: always
    env_file:
      - .env.azure
    volumes:
      - novus_data:/data
    networks:
      - novus_net
    # Memory and CPU constraints to protect Azure VM B2 (1GB RAM) from OOM
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.8"
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  reverse-proxy:
    image: nginx:alpine
    container_name: novuswarden_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - novus_net
    depends_on:
      - novuswarden
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

volumes:
  novus_data:
    driver: local

networks:
  novus_net:
    driver: bridge

