<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovusWarden Control Plane</title>
    <link rel="icon" type="image/x-icon" href="/vw_static/favicon.ico?v=20261102" />
    <link rel="icon" type="image/png" sizes="32x32" href="/vw_static/favicon-32x32.png?v=20261102" />
    <link rel="icon" type="image/png" sizes="16x16" href="/vw_static/favicon-16x16.png?v=20261102" />
    <link rel="apple-touch-icon" sizes="180x180" href="/vw_static/apple-touch-icon.png?v=20261102" />
    <style>
      :root, html.dark {
        --admin-bg: #010811;
        --admin-page-bg: #0b0f19;
        --admin-header-bg: #0a101d;
        --admin-header-border: #1e293b;
        --admin-card-bg: rgba(15, 23, 42, 0.88);
        --admin-card-border: rgba(56, 189, 248, 0.3);
        --admin-card-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(14, 165, 233, 0.15);
        --admin-surface-bg: #1f2937;
        --admin-surface-alt: #0b0f19;
        --admin-table-head: #161e2e;
        --admin-btn-bg: #1f2937;
        --admin-btn-border: #374151;
        --admin-btn-text: #e5e7eb;
        --admin-text-main: #f8fafc;
        --admin-text-subtle: #cbd5e1;
        --admin-text-secondary: #94a3b8;
        --admin-text-muted: #64748b;
        --admin-input-bg: rgba(2, 6, 23, 0.85);
        --admin-input-border: #334155;
        --admin-input-text: #ffffff;
        --admin-scrollbar-track: #0b0f19;
        --admin-scrollbar-thumb: #1f2937;
      }
      html.light {
        --admin-bg: #f0f6fb;
        --admin-page-bg: #f8fafc;
        --admin-header-bg: #ffffff;
        --admin-header-border: #e2e8f0;
        --admin-card-bg: rgba(255, 255, 255, 0.96);
        --admin-card-border: #cbd5e1;
        --admin-card-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08), 0 0 25px rgba(2, 132, 199, 0.08);
        --admin-surface-bg: #f1f5f9;
        --admin-surface-alt: #f8fafc;
        --admin-table-head: #e2e8f0;
        --admin-btn-bg: #f1f5f9;
        --admin-btn-border: #cbd5e1;
        --admin-btn-text: #0f172a;
        --admin-text-main: #0f172a;
        --admin-text-subtle: #334155;
        --admin-text-secondary: #475569;
        --admin-text-muted: #64748b;
        --admin-input-bg: #ffffff;
        --admin-input-border: #cbd5e1;
        --admin-input-text: #0f172a;
        --admin-scrollbar-track: #f1f5f9;
        --admin-scrollbar-thumb: #cbd5e1;
      }
      html.light input,
      html.light select,
      html.light textarea {
        color-scheme: light;
      }
      html.dark input,
      html.dark select,
      html.dark textarea {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--admin-page-bg);
        color: var(--admin-text-main);
        overflow-x: hidden;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      /* Clean cyber scrollbar across entire Admin UI */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--admin-scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--admin-scrollbar-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #38bdf8;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--admin-scrollbar-thumb) var(--admin-scrollbar-track);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/admin/src/main.ts"></script>
  </body>
</html>
