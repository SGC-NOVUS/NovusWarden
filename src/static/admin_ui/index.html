<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovusWarden Control Plane</title>
    <link rel="icon" type="image/x-icon" href="/vw_static/favicon.ico?v=20261102" />
    <link rel="icon" type="image/png" sizes="32x32" href="/vw_static/favicon-32x32.png?v=20261102" />
    <link rel="icon" type="image/png" sizes="16x16" href="/vw_static/favicon-16x16.png?v=20261102" />
    <link rel="apple-touch-icon" sizes="180x180" href="/vw_static/apple-touch-icon.png?v=20261102" />
    <style>
      :root, html.dark {
        --admin-bg: #030712;
        --admin-page-bg: #050b18;
        --admin-header-bg: rgba(8, 15, 30, 0.86);
        --admin-header-border: rgba(56, 189, 248, 0.16);
        --admin-card-bg: rgba(13, 22, 41, 0.88);
        --admin-card-border: rgba(56, 189, 248, 0.18);
        --admin-card-shadow: 0 20px 44px -14px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(148, 163, 184, 0.05);
        --admin-surface-bg: rgba(30, 41, 59, 0.72);
        --admin-surface-alt: rgba(7, 13, 27, 0.9);
        --admin-table-head: rgba(15, 25, 45, 0.95);
        --admin-btn-bg: rgba(30, 41, 59, 0.8);
        --admin-btn-border: rgba(71, 85, 105, 0.7);
        --admin-btn-text: #e2e8f0;
        --admin-text-main: #f8fafc;
        --admin-text-subtle: #cbd5e1;
        --admin-text-secondary: #94a3b8;
        --admin-text-muted: #64748b;
        --admin-input-bg: rgba(4, 9, 21, 0.88);
        --admin-input-border: rgba(51, 65, 85, 0.9);
        --admin-input-text: #f8fafc;
        --admin-accent: #38bdf8;
        --admin-scrollbar-track: #050b18;
        --admin-scrollbar-thumb: #1e293b;
      }
      html.light {
        --admin-bg: #f1f5f9;
        --admin-page-bg: #f8fafc;
        --admin-header-bg: rgba(255, 255, 255, 0.92);
        --admin-header-border: rgba(15, 23, 42, 0.09);
        --admin-card-bg: rgba(255, 255, 255, 0.97);
        --admin-card-border: rgba(15, 23, 42, 0.1);
        --admin-card-shadow: 0 14px 32px -10px rgba(15, 23, 42, 0.09), 0 1px 2px rgba(15, 23, 42, 0.04);
        --admin-surface-bg: #f1f5f9;
        --admin-surface-alt: #f8fafc;
        --admin-table-head: #f1f5f9;
        --admin-btn-bg: #f1f5f9;
        --admin-btn-border: #cbd5e1;
        --admin-btn-text: #0f172a;
        --admin-text-main: #0f172a;
        --admin-text-subtle: #334155;
        --admin-text-secondary: #475569;
        --admin-text-muted: #64748b;
        --admin-input-bg: #ffffff;
        --admin-input-border: #cbd5e1;
        --admin-input-text: #0f172a;
        --admin-accent: #0284c7;
        --admin-scrollbar-track: #f1f5f9;
        --admin-scrollbar-thumb: #cbd5e1;
      }
      html.light input,
      html.light select,
      html.light textarea {
        color-scheme: light;
      }
      html.dark input,
      html.dark select,
      html.dark textarea {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--admin-page-bg);
        color: var(--admin-text-main);
        overflow-x: hidden;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      /* Clean cyber scrollbar across entire Admin UI */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--admin-scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--admin-scrollbar-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #38bdf8;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--admin-scrollbar-thumb) var(--admin-scrollbar-track);
      }
    </style>
    <script type="module" crossorigin src="/admin/ui/assets/admin-BuYe6vve.js"></script>

  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
